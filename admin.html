<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý thiệp tốt nghiệp</title><style>
body{margin:0;background:#f4efeb;color:#382b29;font:15px system-ui,sans-serif}.wrap{max-width:1000px;margin:32px auto;padding:0 18px}h1,h2{color:#671c24}.login,.panel{background:#fff;padding:22px;border-radius:10px;box-shadow:0 4px 20px #32101412;margin:18px 0}input,button{font:inherit;padding:10px;border:1px solid #d8c6b7;border-radius:6px}button{background:#671c24;color:#fff;cursor:pointer}#token{width:min(480px,80%)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:#f8f1e9;border-radius:8px;padding:16px}.stat strong{display:block;color:#671c24;font-size:26px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}td{overflow-wrap:anywhere}.table-wrap{overflow:auto}.hidden{display:none}.status{color:#85343a}
</style></head><body><main class="wrap"><h1>Thống kê thiệp tốt nghiệp</h1><section class="login"><label for="token">Mã quản trị</label> <input id="token" type="password" autocomplete="current-password" placeholder="Nhập ADMIN_TOKEN"> <button id="load">Xem dữ liệu</button><p id="status" class="status">Mã quản trị được gửi đến API để xác thực, không lưu trên máy chủ.</p></section><div id="dashboard" class="hidden"><section id="summary" class="summary"></section><section class="panel"><h2>Xác nhận tham dự</h2><div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Họ tên</th><th>Tham dự</th><th>Số khách</th></tr></thead><tbody id="rsvps"></tbody></table></div></section><section class="panel"><h2>Lời chúc</h2><div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Họ tên</th><th>Lời chúc</th></tr></thead><tbody id="wishes"></tbody></table></div></section></div></main><script>
const $=id=>document.getElementById(id);function cell(text){const td=document.createElement('td');td.textContent=text;return td}function date(value){return new Date(value).toLocaleString('vi-VN')}$('load').onclick=async()=>{const status=$('status');status.textContent='Đang tải…';try{const response=await fetch('/api/admin',{headers:{Authorization:'Bearer '+$('token').value}});const data=await response.json();if(!response.ok)throw Error(data.error||'Không tải được dữ liệu');$('dashboard').classList.remove('hidden');$('summary').replaceChildren(...[['Lượt phản hồi',data.summary.responses],['Sẽ tham dự',data.summary.attending],['Tổng số khách',data.summary.guests],['Lượt thả tim',data.summary.hearts]].map(([label,value])=>{const box=document.createElement('div');box.className='stat';const strong=document.createElement('strong');strong.textContent=value;box.append(strong,document.createTextNode(label));return box}));$('rsvps').replaceChildren(...data.rsvps.map(row=>{const tr=document.createElement('tr');tr.append(cell(date(row.created_at)),cell(row.name),cell(row.attending?'Có':'Không'),cell(row.attending?row.guest_count:0));return tr}));$('wishes').replaceChildren(...data.wishes.map(row=>{const tr=document.createElement('tr');tr.append(cell(date(row.created_at)),cell(row.name),cell(row.message));return tr}));status.textContent='Đã cập nhật lúc '+new Date().toLocaleTimeString('vi-VN')}catch(error){status.textContent=error.message}};
</script></body></html>
